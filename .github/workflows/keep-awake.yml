name: Keep the demo awake

on:
  schedule:
    # Every 10 minutes, UTC. GitHub may start the run a few minutes late.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: curl --fail --show-error --retry 2 --retry-delay 5 --retry-all-errors --max-time 90 "https://qloo-taste-desk.onrender.com/api/health"
