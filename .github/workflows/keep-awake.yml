name: Keep the demo awake

on:
  schedule:
    # Every 10 minutes, UTC. GitHub may start the run a few minutes late.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping the health check
        run: |
          for attempt in 1 2 3 4 5 6; do
            if status=$(curl --fail --show-error --silent --output /dev/null --write-out '%{http_code}' --max-time 60 "https://qloo-taste-desk.onrender.com/api/health"); then
              printf 'Attempt %s/6: HTTP %s\n' "$attempt" "$status"
              exit 0
            else
              curl_exit=$?
              printf 'Attempt %s/6: HTTP %s (curl exit %s)\n' "$attempt" "${status:-000}" "$curl_exit"
            fi

            if [ "$attempt" -lt 6 ]; then
              sleep 20
            fi
          done

          exit 1
