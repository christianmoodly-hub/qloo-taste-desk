services:
  - type: web
    name: taste-desk
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w client
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: HOST
        value: 0.0.0.0
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_TRUSTED_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
